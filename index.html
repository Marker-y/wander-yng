<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>wander-yng</title>
<style>
/* ═══════════ THEMES ═══════════ */
:root, [data-theme="dark"] {
  --bg:#0d0d0d;
  --lane-bg:#1a1a1a;
  --lane-alt:#141414;
  --tile:#000;
  --tile-hold:#1a1a1a;
  --hit-line:#ff3366;
  --text:#fff;
  --muted:#888;
  --accent:#ff3366;
  --gold:#ffd700;
}
[data-theme="light"] {
  --bg:#f5f5f5;
  --lane-bg:#fff;
  --lane-alt:#f0f0f0;
  --tile:#222;
  --tile-hold:#333;
  --hit-line:#e63946;
  --text:#222;
  --muted:#666;
  --accent:#e63946;
  --gold:#e8a700;
}
[data-theme="pinkblue"] {
  --bg:#ffe6f0;
  --lane-bg:#fff0f5;
  --lane-alt:#ffe6f0;
  --tile:#ff6b9d;
  --tile-hold:#ff8fb1;
  --hit-line:#ff6b9d;
  --text:#5a3a4d;
  --muted:#a87a92;
  --accent:#ff6b9d;
  --gold:#ffb3c6;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text);
}

/* rotate prompt removed: game is landscape-first */
#app { position:fixed; inset:0; display:flex; flex-direction:column; }

/* ── TOP BAR ── */
#topbar {
  height:56px; display:flex; align-items:center; gap:12px;
  padding:0 16px; background:var(--bg);
  border-bottom:1px solid rgba(128,128,128,0.15);
  flex-shrink:0;
}
#logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.1em; }
#logo .ic { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#ff6b9d,#4ecdc4); display:grid; place-items:center; font-size:1.2em; }
#theme-toggle { margin-left:auto; display:flex; background:var(--lane-alt); border-radius:20px; padding:3px; }
#theme-toggle button { background:transparent; border:none; width:32px; height:32px; border-radius:16px; font-size:1em; cursor:pointer; opacity:0.5; }
#theme-toggle button.active { background:var(--lane-bg); opacity:1; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
#acct { position:relative; }
#acct-btn { background:var(--lane-alt); border:1px solid rgba(128,128,128,0.2); color:var(--text); padding:7px 14px; border-radius:20px; font-size:.85em; cursor:pointer; }
#acct-menu { position:absolute; top:44px; right:0; background:var(--lane-bg); border:1px solid rgba(128,128,128,0.2); border-radius:12px; padding:8px; min-width:140px; display:none; box-shadow:0 8px 32px rgba(0,0,0,0.3); }
#acct-menu.show { display:block; }
#acct-menu button { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--text); padding:10px 12px; border-radius:8px; font-size:.9em; cursor:pointer; }
#acct-menu button:hover { background:var(--lane-alt); }

/* ── VIEWS ── */
.view { display:none; flex:1; flex-direction:column; overflow:hidden; }
.view.active { display:flex; }

/* ── MENU ── */
#view-menu { padding:20px; gap:16px; overflow-y:auto; }
.menu-header { text-align:center; margin-bottom:8px; }
.menu-header h1 { font-size:1.6em; margin-bottom:6px; }
.menu-header p { color:var(--muted); font-size:.9em; }

.section-title { font-size:.75em; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:8px 0 4px; }

.song-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; }
.song-card {
  background:var(--lane-bg); border:1px solid rgba(128,128,128,0.15);
  border-radius:16px; padding:16px; cursor:pointer; transition:transform .1s;
}
.song-card:active { transform:scale(0.98); }
.song-card .icon { font-size:2em; margin-bottom:8px; }
.song-card .name { font-weight:700; font-size:.95em; margin-bottom:4px; }
.song-card .meta { font-size:.75em; color:var(--muted); }
.song-card .badge { display:inline-block; font-size:.65em; background:var(--accent); color:#fff; padding:2px 8px; border-radius:10px; margin-bottom:6px; }

.quick-actions { display:flex; gap:12px; margin-top:8px; }

.sound-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
.sound-btn {
  background:var(--lane-bg); border:1px solid rgba(128,128,128,0.2);
  border-radius:12px; padding:12px 8px; cursor:pointer; text-align:center;
  font-size:0.85em; font-weight:600;
}
.sound-btn:active { transform:scale(0.96); }
.sound-btn.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn {
  flex:1; padding:14px 20px; border-radius:12px; border:none; font-size:.95em; font-weight:600; cursor:pointer;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-ghost { background:var(--lane-alt); color:var(--text); border:1px solid rgba(128,128,128,0.2); }

.share-box { display:flex; gap:8px; margin-top:8px; }
.share-box input { flex:1; background:var(--lane-bg); border:1px solid rgba(128,128,128,0.2); border-radius:10px; padding:12px; color:var(--text); font-size:.9em; }
.share-box button { background:var(--lane-alt); border:1px solid rgba(128,128,128,0.2); border-radius:10px; color:var(--text); padding:0 16px; font-size:.85em; cursor:pointer; }

/* ── GAME ── */
#view-game { position:relative; background:var(--bg); }
#game-canvas { display:block; width:100%; height:100%; }
#countdown {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:5em; font-weight:800; color:var(--accent); pointer-events:none;
}
#hud {
  position:absolute; top:12px; left:0; right:0; display:flex; justify-content:space-between;
  padding:0 20px; pointer-events:none;
}
.hud-box { text-align:center; }
.hud-box .l { font-size:.6em; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.hud-box .v { font-size:1.4em; font-weight:800; }
#hud-score .v { color:var(--gold); }
#hud-combo .v { color:var(--accent); }
#pause-btn {
  position:absolute; top:12px; right:20px; background:rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:8px;
  padding:8px 16px; font-size:.85em; cursor:pointer; z-index:10;
}

/* ── RESULT ── */
#overlay {
  position:fixed; inset:0; z-index:200; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); padding:24px;
}
#overlay.show { display:flex; }
#ov-title { font-size:2em; font-weight:800; }
#ov-sub { color:var(--muted); }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(300px,90vw); }
.stat { background:var(--lane-bg); border-radius:16px; padding:16px; text-align:center; }
.stat .sl { font-size:.65em; color:var(--muted); text-transform:uppercase; }
.stat .sv { font-size:1.6em; font-weight:800; color:var(--gold); margin-top:4px; }
.ov-actions { display:flex; gap:12px; margin-top:8px; }

/* ── EDITOR ── */
#view-editor { padding-top:56px; }
.ed-bar { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--lane-bg); border-bottom:1px solid rgba(128,128,128,0.15); flex-wrap:wrap; }
.ed-bar input { background:var(--lane-alt); border:1px solid rgba(128,128,128,0.2); border-radius:8px; padding:8px 12px; color:var(--text); font-size:.85em; }
.ed-toolbar { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--lane-bg); border-bottom:1px solid rgba(128,128,128,0.15); flex-wrap:wrap; }
.ed-toolbar button { background:var(--lane-alt); border:1px solid rgba(128,128,128,0.2); border-radius:8px; color:var(--text); padding:8px 14px; font-size:.8em; cursor:pointer; }
.ed-toolbar button.on { background:var(--accent); color:#fff; }
.ed-roll-wrap { flex:1; overflow:auto; background:var(--bg); position:relative; }
#roll-canvas { display:block; touch-action:none; }
.ed-preview { height:100px; border-top:1px solid rgba(128,128,128,0.15); background:var(--lane-alt); }
#preview-canvas { display:block; width:100%; height:100%; }

/* ── MODAL ── */
#modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:300; }
#modal-overlay.show { display:flex; }
.modal { background:var(--lane-bg); border-radius:16px; padding:24px; width:min(320px,90vw); }
.modal h3 { margin-bottom:16px; }
.modal input { width:100%; background:var(--lane-alt); border:1px solid rgba(128,128,128,0.2); border-radius:10px; padding:12px; margin-bottom:12px; color:var(--text); font-size:1em; }
.modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
.modal button { padding:10px 20px; border-radius:10px; border:none; font-size:.9em; cursor:pointer; }
.modal .primary { background:var(--accent); color:#fff; }
.modal .secondary { background:var(--lane-alt); color:var(--text); }

/* ── TOAST ── */
#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); color:#fff; padding:12px 24px; border-radius:24px; font-size:.9em; opacity:0; transition:opacity .3s; pointer-events:none; z-index:400; }
#toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div id="logo"><div class="ic">🎵</div>wander-yng</div>
    <div id="theme-toggle">
      <button data-theme="dark" title="Dark">🌙</button>
      <button data-theme="light" title="Light">☀️</button>
      <button data-theme="pinkblue" title="Pink/Blue">🌸</button>
    </div>
    <div id="acct">
      <button id="acct-btn">👤 游客</button>
      <div id="acct-menu">
        <button id="btn-login">登录</button>
        <button id="btn-reg">注册</button>
        <button id="btn-logout" style="display:none">退出</button>
      </div>
    </div>
  </div>

  <!-- MENU -->
  <div class="view active" id="view-menu">
    <div class="menu-header">
      <h1>🎹 选一首开始</h1>
      <p>点击黑块 · 长按长条 · 奏出节拍</p>
    </div>
    
    <div class="section-title">服务器谱面</div>
    <div class="song-grid" id="pub-songs"></div>
    <p id="no-pub" style="color:var(--muted);font-size:.85em;padding:12px;display:none">还没有发布的谱面，去编辑器做一个吧</p>
    
    <div class="quick-actions">
      <button class="btn btn-primary" id="btn-quick">⚡ 快速开始</button>
      <button class="btn btn-ghost" id="btn-editor">🎼 谱面编辑器</button>
    </div>
    
    <div class="section-title">打击音效</div>
    <div class="sound-grid" id="sound-grid"></div>
    
    <div class="share-box">
      <input id="share-url" placeholder="选曲后显示分享链接..." readonly>
      <button id="btn-copy">复制</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="view" id="view-game">
    <canvas id="game-canvas"></canvas>
    <div id="countdown"></div>
    <div id="hud">
      <div class="hud-box" id="hud-score"><div class="l">Score</div><div class="v">0</div></div>
      <div class="hud-box" id="hud-combo"><div class="l">Combo</div><div class="v">0</div></div>
      <div class="hud-box" id="hud-lives"><div class="l">Lives</div><div class="v">❤️❤️❤️</div></div>
    </div>
    <button id="pause-btn">⏸</button>
  </div>

  <!-- EDITOR -->
  <div class="view" id="view-editor">
    <div class="ed-bar">
      <input id="ed-name" class="nm" placeholder="曲名" value="未命名">
      <input id="ed-bpm" type="number" placeholder="BPM" value="120" style="width:70px">
      <button class="btn btn-primary" id="ed-test" style="padding:8px 16px;font-size:.85em">▶ 测试</button>
      <button class="btn btn-ghost" id="ed-back" style="padding:8px 16px;font-size:.85em">返回</button>
    </div>
    <div class="ed-toolbar">
      <button id="tool-tap" class="on">点击</button>
      <button id="tool-hold">长按</button>
      <span style="margin-left:auto;color:var(--muted);font-size:.8em">点击网格添加音符，再次点击删除</span>
    </div>
    <div class="ed-roll-wrap">
      <canvas id="roll-canvas"></canvas>
    </div>
    <div class="ed-preview">
      <canvas id="preview-canvas"></canvas>
    </div>
  </div>

  <!-- RESULT -->
  <div id="overlay">
    <div id="ov-title"></div>
    <div id="ov-sub"></div>
    <div class="stats" id="ov-stats"></div>
    <div class="ov-actions">
      <button class="btn btn-primary" id="ov-retry">重试</button>
      <button class="btn btn-ghost" id="ov-menu">返回菜单</button>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-overlay">
    <div class="modal" id="login-modal">
      <h3>登录</h3>
      <input id="login-user" placeholder="用户名">
      <input id="login-pass" type="password" placeholder="密码">
      <div class="actions">
        <button class="secondary" id="login-cancel">取消</button>
        <button class="primary" id="login-ok">登录</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>
</div>

<script>
// ══════════════════ CONFIG ═══════════════════
const API_BASE = '';
let TOKEN = localStorage.getItem('wy_token') || '';
let USER = null;
let THEME = localStorage.getItem('wy_theme') || 'dark';
let SOUND = localStorage.getItem('wy_sound') || 'piano';
let CURRENT = null;

// ══════════════════ API ═══════════════════
async function api(path, opts={}) {
  const url = API_BASE + path;
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(url, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

// ══════════════════ SOUND ENGINE ═══════════════════
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

const SOUND_PRESETS = {
  piano: { name: '🎹 钢琴', play: (ctx, t, lane) => {
    const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
    const freq = freqs[lane] || 523.25;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0, t);
    gain.gain.linearRampToValueAtTime(0.4, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.5);
  }},
  marimba: { name: '🎵 马林巴', play: (ctx, t, lane) => {
    const freqs = [440, 554.37, 659.25, 880];
    const freq = freqs[lane] || 440;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.9, t + 0.3);
    gain.gain.setValueAtTime(0.0, t);
    gain.gain.linearRampToValueAtTime(0.5, t + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.6);
  }},
  electric: { name: '⚡ 电子', play: (ctx, t, lane) => {
    const freqs = [392, 493.88, 587.33, 783.99];
    const freq = freqs[lane] || 392;
    const osc = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc2.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    osc2.frequency.setValueAtTime(freq * 1.01, t);
    gain.gain.setValueAtTime(0.0, t);
    gain.gain.linearRampToValueAtTime(0.15, t + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc2.start(t);
    osc.stop(t + 0.3);
    osc2.stop(t + 0.3);
  }},
  chime: { name: '🔔 风铃', play: (ctx, t, lane) => {
    const freqs = [880, 1108.73, 1318.51, 1760];
    const freq = freqs[lane] || 880;
    const osc = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc2.type = 'sine';
    osc.frequency.setValueAtTime(freq, t);
    osc2.frequency.setValueAtTime(freq * 2, t);
    gain.gain.setValueAtTime(0.0, t);
    gain.gain.linearRampToValueAtTime(0.3, t + 0.001);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc2.start(t);
    osc.stop(t + 1);
    osc2.stop(t + 1);
  }},
  bass: { name: '🎸 贝斯', play: (ctx, t, lane) => {
    const freqs = [130.81, 164.81, 196.00, 261.63]; // C3 E3 G3 C4
    const freq = freqs[lane] || 130.81;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0, t);
    gain.gain.linearRampToValueAtTime(0.6, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.7);
  }}
};

function playHit(lane) {
  const preset = SOUND_PRESETS[SOUND] || SOUND_PRESETS.piano;
  const ctx = getAudio();
  preset.play(ctx, ctx.currentTime, lane);
}

function playHoldStart(lane) {
  const ctx = getAudio();
  const preset = SOUND_PRESETS[SOUND] || SOUND_PRESETS.piano;
  preset.play(ctx, ctx.currentTime, lane);
}

function playHoldEnd(lane) {
  const ctx = getAudio();
  const preset = SOUND_PRESETS[SOUND] || SOUND_PRESETS.piano;
  preset.play(ctx, ctx.currentTime, lane);
}

// ══════════════════ UI HELPERS ═══════════════════
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('acct-menu').classList.remove('show');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function setTheme(t) {
  THEME = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('wy_theme', t);
  document.querySelectorAll('#theme-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.theme === t);
  });
}

function updateShare() {
  if (!CURRENT) return;
  const url = location.origin + location.pathname + '#' + btoa(JSON.stringify({
    name: CURRENT.name, bpm: CURRENT.bpm, notes: CURRENT.notes
  }));
  document.getElementById('share-url').value = url;
}

// ══════════════════ MENU ═══════════════════
function renderSoundGrid() {
  const grid = document.getElementById('sound-grid');
  if (!grid) return;
  grid.innerHTML = '';
  Object.entries(SOUND_PRESETS).forEach(([key, preset]) => {
    const btn = document.createElement('div');
    btn.className = 'sound-btn' + (key === SOUND ? ' on' : '');
    btn.textContent = preset.name;
    btn.onclick = () => {
      SOUND = key;
      localStorage.setItem('wy_sound', key);
      renderSoundGrid();
      // preview
      playHit(0);
    };
    grid.appendChild(btn);
  });
}

function renderMenu() {
  // Fetch published
  api('/api/charts').then(res => {
    const pubContainer = document.getElementById('pub-songs');
    const noPub = document.getElementById('no-pub');
    pubContainer.innerHTML = '';
    if (!res.ok || !res.data.charts || res.data.charts.length === 0) {
      noPub.style.display = 'block';
      return;
    }
    noPub.style.display = 'none';
    res.data.charts.forEach(chart => {
      const card = document.createElement('div');
      card.className = 'song-card';
      card.innerHTML = `<span class="badge">服务器</span><div class="icon">🌐</div><div class="name">${chart.name}</div><div class="meta">BPM ${chart.bpm} · ${chart.notes.length} 音符</div>`;
      card.onclick = () => { CURRENT = chart; updateShare(); startGame(chart); };
      pubContainer.appendChild(card);
    });
  });
}

// ══════════════════ GAME ENGINE ═══════════════════
const $gc = document.getElementById('game-canvas');
const gctx = $gc.getContext('2d');
let G = {};

function resizeGame() {
  $gc.width = $gc.clientWidth * devicePixelRatio;
  $gc.height = $gc.clientHeight * devicePixelRatio;
  gctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  G.W = $gc.clientWidth;
  G.H = $gc.clientHeight;
}

function initGame(song) {
  resizeGame();
  G.song = song;
  G.bpm = song.bpm;
  G.stepDur = 60 / G.bpm / 4;
  G.fallTime = 2.0;
  G.hitY = G.H * 0.85;
  G.laneW = G.W / 4;
  G.tileH = G.laneW * 0.9;
  G.speed = (G.hitY + G.tileH) / G.fallTime;
  
  G.score = 0;
  G.combo = 0;
  G.maxCombo = 0;
  G.lives = 3;
  G.state = 'countdown';
  G.countdown = 3;
  G.t0 = null;
  
  G.runtime = song.notes.map(() => ({ state: 'pending', pointerId: null }));
  G.particles = [];
  
  updateHUD();
  document.getElementById('countdown').textContent = '3';
}

function noteY(note, t) {
  const [step] = note;
  const startT = step * G.stepDur;
  return G.hitY - (startT - t) * G.speed;
}

function draw() {
  const { W, H } = G;
  const bg = getComputedStyle(document.body).getPropertyValue('--bg').trim();
  const laneBg = getComputedStyle(document.body).getPropertyValue('--lane-bg').trim();
  const laneAlt = getComputedStyle(document.body).getPropertyValue('--lane-alt').trim();
  const tile = getComputedStyle(document.body).getPropertyValue('--tile').trim();
  const tileHold = getComputedStyle(document.body).getPropertyValue('--tile-hold').trim();
  const hitLine = getComputedStyle(document.body).getPropertyValue('--hit-line').trim();
  
  // Clear
  gctx.fillStyle = bg;
  gctx.fillRect(0, 0, W, H);
  
  if (G.state === 'countdown') {
    // Just draw lanes during countdown
    for (let i = 0; i < 4; i++) {
      gctx.fillStyle = i % 2 === 0 ? laneBg : laneAlt;
      gctx.fillRect(i * G.laneW, 0, G.laneW, H);
    }
    // Hit line
    gctx.strokeStyle = hitLine;
    gctx.lineWidth = 3;
    gctx.beginPath();
    gctx.moveTo(0, G.hitY);
    gctx.lineTo(W, G.hitY);
    gctx.stroke();
    return;
  }
  
  const t = performance.now() / 1000 - G.t0;
  
  // Lanes
  for (let i = 0; i < 4; i++) {
    gctx.fillStyle = i % 2 === 0 ? laneBg : laneAlt;
    gctx.fillRect(i * G.laneW, 0, G.laneW, H);
  }
  
  // Hit line
  gctx.strokeStyle = hitLine;
  gctx.lineWidth = 3;
  gctx.beginPath();
  gctx.moveTo(0, G.hitY);
  gctx.lineTo(W, G.hitY);
  gctx.stroke();
  
  // Notes
  G.song.notes.forEach((note, i) => {
    const rt = G.runtime[i];
    if (rt.state === 'done' || rt.state === 'missed') return;
    
    const [step, pitch, dur, type] = note;
    const y = noteY(note, t);
    const h = type === 1 ? dur * G.stepDur * G.speed : G.tileH;
    const x = pitch * G.laneW + (G.laneW - G.tileH) / 2;
    const w = G.tileH;
    
    if (y + h < 0 || y > H + 50) return;
    
    // Draw tile
    gctx.fillStyle = type === 1 ? tileHold : tile;
    gctx.fillRect(x, y - h, w, h);
    
    // For hold tiles, add block-like texture: stripes + end cap
    if (type === 1) {
      // Diagonal stripes pattern
      gctx.strokeStyle = 'rgba(255,255,255,0.08)';
      gctx.lineWidth = 2;
      for (let yy = y - h + 12; yy < y; yy += 14) {
        gctx.beginPath();
        gctx.moveTo(x + 4, yy);
        gctx.lineTo(x + w - 4, yy - 10);
        gctx.stroke();
      }
      // End cap (brighter)
      gctx.fillStyle = tile;
      gctx.fillRect(x, y - 16, w, 16);
      // Top edge highlight
      gctx.fillStyle = 'rgba(255,255,255,0.12)';
      gctx.fillRect(x, y - h, w, 3);
    } else {
      // Tap tile: top highlight for block feel
      gctx.fillStyle = 'rgba(255,255,255,0.1)';
      gctx.fillRect(x, y - h, w, 3);
    }
    
    // Highlight if holding
    if (rt.state === 'holding') {
      gctx.strokeStyle = hitLine;
      gctx.lineWidth = 3;
      gctx.strokeRect(x, y - h, w, h);
    }
  });
  
  // Particles
  G.particles = G.particles.filter(p => {
    p.life -= 0.05;
    if (p.life <= 0) return false;
    p.y += p.vy;
    p.x += p.vx;
    gctx.globalAlpha = p.life;
    gctx.fillStyle = hitLine;
    gctx.beginPath();
    gctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    gctx.fill();
    gctx.globalAlpha = 1;
    return true;
  });
}

function loop() {
  if (G.state === 'playing') {
    const t = performance.now() / 1000 - G.t0;
    
    // Check misses
    G.song.notes.forEach((note, i) => {
      const rt = G.runtime[i];
      if (rt.state !== 'pending' && rt.state !== 'holding') return;
      const y = noteY(note, t);
      if (y > G.hitY + G.tileH) {
        rt.state = 'missed';
        G.combo = 0;
        G.lives--;
        updateHUD();
        if (G.lives <= 0) {
          G.state = 'gameover';
          setTimeout(showResult, 500);
        }
      }
    });
    
    // Check win
    const allDone = G.runtime.every(r => r.state === 'done' || r.state === 'missed');
    if (allDone && G.runtime.length > 0) {
      G.state = 'win';
      setTimeout(showResult, 500);
    }
  }
  
  draw();
  if (G.state !== 'ended') requestAnimationFrame(loop);
}

function startCountdown() {
  const cd = document.getElementById('countdown');
  let count = 3;
  cd.textContent = count;
  
  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      cd.textContent = count;
    } else if (count === 0) {
      cd.textContent = 'GO!';
    } else {
      clearInterval(timer);
      cd.textContent = '';
      G.state = 'playing';
      G.t0 = performance.now() / 1000;
    }
  }, 1000);
}

function startGame(song) {
  showView('view-game');
  initGame(song);
  startCountdown();
  requestAnimationFrame(loop);
}

function updateHUD() {
  document.querySelector('#hud-score .v').textContent = Math.floor(G.score);
  document.querySelector('#hud-combo .v').textContent = G.combo;
  document.querySelector('#hud-lives .v').textContent = '❤️'.repeat(Math.max(0, G.lives));
}

function spawnParticles(x, y) {
  for (let i = 0; i < 8; i++) {
    G.particles.push({
      x: x + G.tileH / 2,
      y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10 - 5,
      r: Math.random() * 4 + 2,
      life: 1
    });
  }
}

function hitTest(clientX, clientY) {
  const rect = $gc.getBoundingClientRect();
  const x = (clientX - rect.left) * (G.W / rect.width);
  const y = (clientY - rect.top) * (G.H / rect.height);
  const t = performance.now() / 1000 - G.t0;
  
  // Find note in hit zone
  let best = null, bestDist = Infinity;
  G.song.notes.forEach((note, i) => {
    const rt = G.runtime[i];
    if (rt.state !== 'pending' && rt.state !== 'holding') return;
    
    const [step, pitch, dur, type] = note;
    const noteY_pos = noteY(note, t);
    const noteX = pitch * G.laneW + (G.laneW - G.tileH) / 2;
    
    // Check lane
    if (x < noteX || x > noteX + G.tileH) return;
    
    // Check vertical distance to hit line
    const dist = Math.abs(noteY_pos - G.hitY);
    if (dist < bestDist && dist < G.tileH * 1.5) {
      bestDist = dist;
      best = i;
    }
  });
  
  return best !== null ? { index: best, dist: bestDist } : null;
}

function onPress(e) {
  if (G.state !== 'playing') return;
  e.preventDefault();
  
  const touches = e.changedTouches || [e];
  for (let i = 0; i < touches.length; i++) {
    const t = touches[i];
    const hit = hitTest(t.clientX, t.clientY);
    if (hit === null) continue;
    
    const noteIdx = hit.index;
    const rt = G.runtime[noteIdx];
    const note = G.song.notes[noteIdx];
    const [step, pitch, dur, type] = note;
    
    rt.pointerId = t.identifier !== undefined ? t.identifier : 'mouse';
    
    if (type === 0) {
      // Tap note
      rt.state = 'done';
      G.combo++;
      G.maxCombo = Math.max(G.maxCombo, G.combo);
      const points = 100 + G.combo * 10;
      G.score += points;
      
      playHit(pitch);
      const noteY_pos = noteY(note, performance.now() / 1000 - G.t0);
      spawnParticles(pitch * G.laneW + (G.laneW - G.tileH) / 2, noteY_pos);
    } else {
      // Hold note - start holding
      rt.state = 'holding';
      rt.holdStart = performance.now() / 1000 - G.t0;
      playHoldStart(pitch);
    }
    
    updateHUD();
  }
}

function onRelease(e) {
  if (G.state !== 'playing') return;
  
  const touches = e.changedTouches || [e];
  for (let i = 0; i < touches.length; i++) {
    const t = touches[i];
    const pid = t.identifier !== undefined ? t.identifier : 'mouse';
    
    G.runtime.forEach((rt, idx) => {
      if (rt.pointerId !== pid) return;
      if (rt.state !== 'holding') return;
      
      const note = G.song.notes[idx];
      const [step, pitch, dur, type] = note;
      const holdDuration = (performance.now() / 1000 - G.t0) - rt.holdStart;
      const requiredDuration = dur * G.stepDur;
      
      if (holdDuration >= requiredDuration * 0.8) {
        rt.state = 'done';
        G.combo++;
        G.maxCombo = Math.max(G.maxCombo, G.combo);
        G.score += 200 + G.combo * 20;
        playHoldEnd(pitch);
      } else {
        rt.state = 'missed';
        G.combo = 0;
        G.lives--;
      }
      rt.pointerId = null;
    });
    
    updateHUD();
    if (G.lives <= 0) {
      G.state = 'gameover';
      setTimeout(showResult, 500);
    }
  }
}

$gc.addEventListener('mousedown', onPress);
$gc.addEventListener('mouseup', onRelease);
$gc.addEventListener('touchstart', onPress, { passive: false });
$gc.addEventListener('touchend', onRelease);
$gc.addEventListener('touchcancel', onRelease);

// ══════════════════ RESULT ═══════════════════
function showResult() {
  const total = G.runtime.length;
  const hits = G.runtime.filter(r => r.state === 'done').length;
  const acc = total ? hits / total : 0;
  const grade = acc >= 0.95 ? 'S' : acc >= 0.8 ? 'A' : acc >= 0.6 ? 'B' : 'C';
  
  document.getElementById('ov-title').textContent = G.state === 'win' ? '🎉 完美！' : '💔 结束';
  document.getElementById('ov-sub').textContent = G.song.name;
  document.getElementById('ov-stats').innerHTML = `
    <div class="stat"><div class="sl">Score</div><div class="sv">${Math.floor(G.score)}</div></div>
    <div class="stat"><div class="sl">Grade</div><div class="sv">${grade}</div></div>
    <div class="stat"><div class="sl">Max Combo</div><div class="sv">${G.maxCombo}</div></div>
    <div class="stat"><div class="sl">Accuracy</div><div class="sv">${(acc * 100).toFixed(0)}%</div></div>
  `;
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('ov-retry').onclick = () => {
  document.getElementById('overlay').classList.remove('show');
  if (CURRENT) startGame(CURRENT);
};
document.getElementById('ov-menu').onclick = () => {
  document.getElementById('overlay').classList.remove('show');
  showView('view-menu');
  renderMenu();
};
document.getElementById('pause-btn').onclick = () => {
  if (G.state === 'playing') {
    G.state = 'paused';
    showOverlay('paused');
  }
};

// ══════════════════ EDITOR ═══════════════════
let ED = { notes: [], bpm: 120, name: '未命名' };
const $roll = document.getElementById('roll-canvas');
const rctx = $roll.getContext('2d');

function resizeEditor() {
  const wrap = document.querySelector('.ed-roll-wrap');
  $roll.width = wrap.clientWidth * devicePixelRatio;
  $roll.height = Math.max(wrap.clientHeight, 800) * devicePixelRatio;
  rctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function drawEditor() {
  const W = $roll.width / devicePixelRatio;
  const H = $roll.height / devicePixelRatio;
  const laneW = W / 4;
  const stepH = 40;
  
  rctx.fillStyle = '#0d0d0d';
  rctx.fillRect(0, 0, W, H);
  
  // Grid
  for (let i = 0; i < 4; i++) {
    rctx.fillStyle = i % 2 === 0 ? '#1a1a1a' : '#141414';
    rctx.fillRect(i * laneW, 0, laneW, H);
    rctx.strokeStyle = '#333';
    rctx.beginPath();
    rctx.moveTo(i * laneW, 0);
    rctx.lineTo(i * laneW, H);
    rctx.stroke();
  }
  
  // Steps
  for (let s = 0; s < 100; s++) {
    rctx.strokeStyle = s % 4 === 0 ? '#444' : '#222';
    rctx.beginPath();
    rctx.moveTo(0, s * stepH);
    rctx.lineTo(W, s * stepH);
    rctx.stroke();
  }
  
  // Notes
  ED.notes.forEach(([step, pitch, dur, type]) => {
    const x = pitch * laneW + 4;
    const y = step * stepH + 4;
    const w = laneW - 8;
    const h = type === 1 ? dur * stepH - 8 : stepH - 8;
    rctx.fillStyle = type === 1 ? '#333' : '#000';
    rctx.fillRect(x, y, w, h);
  });
}

$roll.addEventListener('click', e => {
  const rect = $roll.getBoundingClientRect();
  const x = (e.clientX - rect.left) * ($roll.width / rect.width / devicePixelRatio);
  const y = (e.clientY - rect.top) * ($roll.height / rect.height / devicePixelRatio);
  const laneW = ($roll.width / devicePixelRatio) / 4;
  const stepH = 40;
  
  const pitch = Math.floor(x / laneW);
  const step = Math.floor(y / stepH);
  
  const existing = ED.notes.findIndex(n => n[0] === step && n[1] === pitch);
  if (existing >= 0) {
    ED.notes.splice(existing, 1);
  } else {
    const type = document.getElementById('tool-hold').classList.contains('on') ? 1 : 0;
    ED.notes.push([step, pitch, type === 1 ? 2 : 1, type]);
    ED.notes.sort((a, b) => a[0] - b[0]);
  }
  drawEditor();
});

document.getElementById('tool-tap').onclick = () => {
  document.getElementById('tool-tap').classList.add('on');
  document.getElementById('tool-hold').classList.remove('on');
};
document.getElementById('tool-hold').onclick = () => {
  document.getElementById('tool-hold').classList.add('on');
  document.getElementById('tool-tap').classList.remove('on');
};
document.getElementById('ed-test').onclick = () => {
  const song = {
    name: document.getElementById('ed-name').value || '未命名',
    bpm: parseInt(document.getElementById('ed-bpm').value) || 120,
    notes: ED.notes.slice()
  };
  CURRENT = song;
  startGame(song);
};
document.getElementById('ed-back').onclick = () => {
  showView('view-menu');
  renderMenu();
};

function showEditor(song) {
  showView('view-editor');
  resizeEditor();
  if (song) {
    ED = { notes: song.notes.slice(), bpm: song.bpm, name: song.name };
    document.getElementById('ed-name').value = song.name;
    document.getElementById('ed-bpm').value = song.bpm;
  } else {
    ED = { notes: [], bpm: 120, name: '未命名' };
    document.getElementById('ed-name').value = '未命名';
    document.getElementById('ed-bpm').value = 120;
  }
  drawEditor();
}

// ══════════════════ AUTH ═══════════════════
function renderAcct() {
  const btn = document.getElementById('acct-btn');
  const menu = document.getElementById('acct-menu');
  if (USER) {
    btn.textContent = '👤 ' + USER.username;
    menu.innerHTML = `<button id="btn-logout">退出 (${USER.username})</button>`;
    document.getElementById('btn-logout').onclick = () => {
      TOKEN = '';
      USER = null;
      localStorage.removeItem('wy_token');
      renderAcct();
      showToast('已退出');
    };
  } else {
    btn.textContent = '👤 游客';
    menu.innerHTML = '<button id="btn-login">登录</button><button id="btn-reg">注册</button>';
    document.getElementById('btn-login').onclick = () => showLogin();
    document.getElementById('btn-reg').onclick = () => showLogin(true);
  }
}

function showLogin(isReg = false) {
  document.getElementById('modal-overlay').classList.add('show');
  document.querySelector('#login-modal h3').textContent = isReg ? '注册' : '登录';
  document.getElementById('login-ok').textContent = isReg ? '注册' : '登录';
  
  const doAuth = async () => {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    if (!user || !pass) { showToast('请输入用户名和密码'); return; }
    
    const endpoint = isReg ? '/api/register' : '/api/login';
    const res = await api(endpoint, { method: 'POST', body: { username: user, password: pass } });
    if (res.ok) {
      TOKEN = res.data.token;
      USER = res.data.user;
      localStorage.setItem('wy_token', TOKEN);
      document.getElementById('modal-overlay').classList.remove('show');
      renderAcct();
      showToast(isReg ? '注册成功' : '登录成功');
    } else {
      showToast(res.data.error || '失败');
    }
  };
  
  document.getElementById('login-ok').onclick = doAuth;
  document.getElementById('login-cancel').onclick = () => {
    document.getElementById('modal-overlay').classList.remove('show');
  };
}

document.getElementById('acct-btn').onclick = () => {
  document.getElementById('acct-menu').classList.toggle('show');
};

// ══════════════════ INIT ═══════════════════
async function init() {
  setTheme(THEME);
  
  // Theme toggle
  document.querySelectorAll('#theme-toggle button').forEach(b => {
    b.onclick = () => setTheme(b.dataset.theme);
    b.classList.toggle('active', b.dataset.theme === THEME);
  });
  
  // Quick start
  document.getElementById('btn-quick').onclick = async () => {
    const res = await api('/api/charts');
    if (res.ok && res.data.charts && res.data.charts.length > 0) {
      CURRENT = res.data.charts[0];
      updateShare();
      startGame(CURRENT);
    } else {
      showToast('还没有谱面，去编辑器做一个吧');
      showEditor(null);
    }
  };
  
  // Editor
  document.getElementById('btn-editor').onclick = () => showEditor(null);
  
  // Copy share
  document.getElementById('btn-copy').onclick = () => {
    const url = document.getElementById('share-url').value;
    if (url) {
      navigator.clipboard.writeText(url);
      showToast('链接已复制');
    }
  };
  
  // Check URL for shared song
  if (location.hash) {
    try {
      const shared = JSON.parse(atob(location.hash.slice(1)));
      CURRENT = shared;
      updateShare();
    } catch {}
  }
  
  // Restore session
  if (TOKEN) {
    const res = await api('/api/me');
    if (res.ok) USER = res.data.user;
    else { TOKEN = ''; localStorage.removeItem('wy_token'); }
  }
  renderAcct();
  renderSoundGrid();
  renderMenu();
}

init();
